<!-- La rangée d'icônes qui vivait ici a été retirée : les neuf comptes sont

<script>
/* ⚠️ UNE seule source de vérité : parenté, contenu FR/EN et destination au
   même endroit. Les traits SVG, les nœuds du plan et la liste de repli en
   sont tous les trois dérivés. Écrits séparément, ils finiraient par ne plus

   ⚠️ Les POSITIONS ne sont plus écrites à la main : elles sont calculées en
   polaire depuis l'ordre de l'arbre (voir `placer`). À 15 nœuds, placer
   chaque x/y à la main devenait ingérable et le moindre ajout décalait tout.
   Ajouter une branche ou un enfant se fait maintenant en une ligne ici. */
var VUE = { w: 1180, h: 780 };
var CENTRE = { x: VUE.w / 2, y: VUE.h / 2 };

/* ⚠️ QUATRE MÈRES, et elles ne mènent NULLE PART. Ce ne sont pas des liens :
   ce sont des étapes. On clique, le portrait s'y rend, et c'est de là que
   partent les vraies destinations. Leur donner une `url` casserait tout le
   geste — un clic partirait du site avant d'avoir montré les enfants.
   C'est aussi pour ça que ce sont des <button> et pas des <a>. */
var MERES = [
  /* ⚠️ TROIS NIVEAUX ici, et c'est la seule branche qui en a : Projets → GitHub
     → les dépôts. GitHub porte À LA FOIS une `url` et des `enfants` : c'est un
     LIEN, pas une étape. C'est possible parce qu'arriver sur Projets déplie
     déjà ses dépôts — il n'y a rien à ouvrir, donc rien ne se perd à ce que le
     clic parte sur le profil. Règle générale : `url` ⇒ destination (même avec
     des enfants) · pas d'`url` + `enfants` ⇒ étape.
     ⚠️ ORDRE DES DÉPÔTS = LEUR PLACE. Ils sont répartis sur un tour à partir de
     -150° : le 1er en haut à gauche, le 2ᵉ en haut à droite, le 3ᵉ dessous.
     Occulta est donc écrite EN DERNIER pour tomber en bas, seule, les deux
     autres en haut — demandé explicitement. Les réordonner les déplace. */
  { id:'projet', i:'i-projet', place: 4,
    fr:['Projets', 'ce que je fabrique'], en:['Projects', 'what I build'],
    enfants: [
      { id:'code', i:'i-github', url:'https://github.com/Maxyull',
        fr:['GitHub', 'Maxyull'], en:['GitHub', 'Maxyull'],
        enfants: [
          { id:'bot', i:'i-discord', url:'https://github.com/Maxyull/Black-Desert-Idle-Discord-Bot',
            fr:['son bot', 'discord.js'], en:['its bot', 'discord.js'] },
          { id:'jeu', i:'i-bdi', url:'https://github.com/Maxyull/black-desert-idle',
            fr:['Black Desert Idle', 'le code'], en:['Black Desert Idle', 'the code'] },
          { id:'occulta', i:'i-occulta', url:'https://occulta.fr',
            fr:['Occulta', 'occulta.fr'], en:['Occulta', 'occulta.fr'] }
        ] }
    ] },

  /* ⚠️ Aucun mailto ici : une adresse en clair sur une page indexée se fait
     moissonner. Le contact passe par LinkedIn. Retiré à la demande de Maxime. */
  { id:'contact', i:'i-contact', place: 0,
    fr:['Contact', 'où me trouver'], en:['Contact', 'where to find me'],
    enfants: [
      { id:'linkedin', i:'i-linkedin', url:'https://www.linkedin.com/in/maxyull',
        fr:['LinkedIn', 'un projet ?'], en:['LinkedIn', 'hire me'] },
      { id:'insta', i:'i-instagram', url:'https://www.instagram.com/maxyull/',
        fr:['Instagram', '@maxyull'], en:['Instagram', '@maxyull'] }
    ] },

  /* ⚠️ Réseaux tient la place de DROITE (3ᵉ de la liste) et ce n'est pas un
     hasard : c'est la mère la plus nombreuse, et le flanc est le seul endroit
     où son éventail a la hauteur qu'il lui faut. En haut à droite, ses six
     enfants sortaient du cadre par le haut. Déplacer cette entrée dans la
     liste, c'est la renvoyer là où elle ne rentre pas. */
  { id:'reseaux', i:'i-reseaux', place: 2,
    fr:['Réseaux', 'ce que je publie'], en:['Social', 'what I post'],
    enfants: [
      { id:'youtube', i:'i-youtube', url:'https://www.youtube.com/@Maxyull',

      { id:'tiktok', i:'i-tiktok', url:'https://www.tiktok.com/@maxyull',

  /* ⚠️ Black Desert Idle en a été RETIRÉ à la demande de Maxime (02/08) : le

  { id:'gaming', i:'i-gaming', place: 1,
    fr:['Gaming', 'où je joue'], en:['Gaming', 'where I play'],
    enfants: [
      { id:'steam', i:'i-steam', url:'https://steamcommunity.com/profiles/76561198035113183/',

        fr:['Twitch', 'quand je stream'], en:['Twitch', 'when I stream'] }

  { id:'shop', i:'i-shop', place: 3,
    fr:['Boutique', 'ce que je vends'], en:['Shop', 'what I sell'],

/* ── placement polaire ─────────────────────────────────────────────────
   Les mères font le tour, chaque fratrie s'ouvre en éventail à partir de SA
   mère et non du centre. Ellipse et non cercle : la vue est plus large que
   haute. Le tour démarre à -126° : l'axe vertical du haut sert de respiration
   entre les deux mères hautes. */
var RX = 330, RY = 160;        /* mère → depuis le centre */

var NOEUDS = [];

function placer(n, profondeur) {
  if (!n.enfants) return;

  /* ⚠️ Une grande fratrie ne tient PAS sur le même arc qu'une petite. Une
     étiquette fait ~90 px de haut, il faut donc ~100 px entre deux voisins,
     soit un arc de 100 × (n-1). À six enfants sur l'arc court, Threads
     percutait Reddit qui percutait Product Hunt (mesuré). On pousse l'anneau
     ET on l'arrondit : c'est l'aplatissement vertical qui tassait les voisins
     dès que l'éventail passait à l'horizontale. */
  var large = n.enfants.length >= 5;
  /* ⚠️ 30° et 230 pour une grande fratrie, pas moins : à 26°/215 l'écart entre
     deux voisins tombait à 87 px pour une étiquette de 88 px de haut. Ça
     passait tout juste à 1120 px de large et se percutait dès que la carte
     rétrécissait d'un cheveu (X × Threads, constaté à 1094). */
  var rx = 225, ry = large ? 230 : 190, pas = large ? 30 : 38;
  var dir = n.a;

  /* ⚠️ Un enfant unique QUI A LUI-MÊME DES ENFANTS (GitHub sous Projets) se pose
     tout près de sa mère : à pleine distance il mangeait tout le rayon
     disponible et il ne restait plus rien pour ses propres enfants. Un enfant
     unique ordinaire (Steam sous Gaming) garde l'anneau normal — le rapprocher
     n'aurait servi qu'à le coller à sa mère. */
  if (n.enfants.length === 1 && n.enfants[0].enfants) { rx = 130; ry = 105; }

  /* ⚠️ Au 3ᵉ niveau : LE DERNIER ENFANT PASSE DESSOUS, les autres s'ouvrent vers
     le haut. Deux essais ratés avant celui-là — un éventail vers le haut met
     forcément le milieu en haut et les DEUX extrêmes en bas (l'inverse de ce
     que Maxime demande) ; et un tour réparti régulièrement à trois enfants
     impose des positions à -150/-30/+90, or -30 vise exactement « Projets »
     depuis GitHub (63 px d'écart, mesuré).
     L'anneau est APLATI (130 × 190) : GitHub n'est qu'à 150 px du bord gauche,
     un cercle de 190 en sortait. Et tout ceci ne tient que parce que « Projets »
     occupe la place de GAUCHE (`place: 4`) — ailleurs, pas la hauteur. */
  var tour = profondeur >= 2;
  if (tour) { rx = 130; ry = 190; pas = 75; }

  n.enfants.forEach(function (e, j, tous) {
    var dessus = tous.length - 1;          /* tous sauf le dernier */
    var ae = tour
      ? (j === dessus ? 90 : -90 + (j - (dessus - 1) / 2) * pas) * Math.PI / 180
      : dir + (j - (tous.length - 1) / 2) * pas * Math.PI / 180;
    e.a = ae;
    e.de = n;
    e.p = profondeur + 1;
    e.x = n.x + Math.cos(ae) * rx;
    e.y = n.y + Math.sin(ae) * ry;
    NOEUDS.push(e);
    placer(e, profondeur + 1);
  });
}

/* ⚠️ La position vient de `place`, PAS de l'ordre du tableau : l'ordre du
   tableau reste l'ordre de lecture (et de tabulation), la place est un choix
   de terrain, chacune payée d'un chevauchement mesuré :
   · Projets (4, gauche) — seul flanc où sa branche à trois niveaux tient, et
     le seul d'où un éventail vers le haut ne sort pas du cadre.
   · Réseaux (2, droite) — six enfants, il lui faut le flanc le plus haut.
   · Boutique (3, bas) et Gaming (1, haut-droite) sont ÉCHANGÉES : Boutique en
     haut à droite, son dernier enfant (PayPal) tombait sur le premier de
     Réseaux (YouTube) — 30 px d'écart, visible en vue éclatée seulement.
   Déplacer une de ces valeurs, c'est rouvrir le chevauchement correspondant. */
MERES.forEach(function (m) {
  m.a = (-126 + m.place * (360 / MERES.length)) * Math.PI / 180;
  m.p = 1;
  m.x = CENTRE.x + Math.cos(m.a) * RX;
  m.y = CENTRE.y + Math.sin(m.a) * RY;
  NOEUDS.push(m);
  placer(m, 1);
});

var NS = 'http://www.w3.org/2000/svg';
var plan = document.getElementById('plan');
var svg = document.getElementById('traits');
var liste = document.getElementById('liste');
var moi = document.getElementById('moi');
var retour = document.getElementById('retour');
var ou = document.getElementById('ou');
var racine = document.documentElement;

svg.setAttribute('viewBox', '0 0 ' + VUE.w + ' ' + VUE.h);

var LENT = matchMedia('(prefers-reduced-motion: reduce)');

/* Deux allures. Quitter le centre est le geste qu'on regarde : il prend son
   temps. Passer d'une mère à l'autre, on connaît déjà le trajet, il file.
   ⚠️ La durée est posée en ligne sur `.moi` et sur `--vol` : la valeur du CSS
   n'est qu'un repli. Les changer là-bas seul ne ferait rien. */
var VOYAGE = 620;         /* mère → centre, et centre → mère en transit */
var VOYAGE_DEPART = 980;  /* centre → mère, au départ du repos */

/* --- fabriques ------------------------------------------------------- */

function trait(de, vers, classe) {
  var l = document.createElementNS(NS, 'line');
  l.setAttribute('x1', de.x); l.setAttribute('y1', de.y);
  l.setAttribute('x2', vers.x); l.setAttribute('y2', vers.y);
  /* ⚠️ `pathLength="1"` normalise la longueur : sans lui un trait court se
     dessine plus vite qu'un long et la construction paraît boiteuse. C'est un
     attribut SVG, il n'a pas d'équivalent CSS. */
  l.setAttribute('pathLength', '1');
  l.setAttribute('class', classe);
  return l;
}

function corps(n, k) {
  return '<span class="derive" style="--t:' + (11 + k * 1.4) + 's;--dx:' +
    (k % 2 ? 5 : -5) + 'px;--dy:' + (k % 3 ? -6 : 5) + 'px">' +
      '<span class="pastille"><svg aria-hidden="true"><use href="#' + n.i + '"/></svg></span>' +
    '</span><span class="n"></span><span class="f"></span>';
}

function poser(el, n) {
  el.style.left = (n.x / VUE.w * 100) + '%';
  el.style.top = (n.y / VUE.h * 100) + '%';
}

/* le pouls court le long du trait quand on survole le nœud qu'il dessert */
function brancherPouls(el, pouls) {
  ['mouseenter', 'focus'].forEach(function (ev) {
    el.addEventListener(ev, function () { pouls.classList.add('actif'); });
  });
  ['mouseleave', 'blur'].forEach(function (ev) {
    el.addEventListener(ev, function () { pouls.classList.remove('actif'); });
  });
}

/* --- les quatre mères, posées une fois pour toutes -------------------- */
MERES.forEach(function (m, k) {
  var base = trait(CENTRE, m, 'base base--vif');
  base.style.animationDelay = (240 + k * 90) + 'ms';
  svg.appendChild(base);

  m._base = base;

  var pouls = trait(CENTRE, m, 'pouls');
  svg.appendChild(pouls);
  m._pouls = pouls;

  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'noeud noeud--mere';
  b.setAttribute('aria-expanded', 'false');
  poser(b, m);
  b.style.animationDelay = (240 + k * 90 + 420) + 'ms';
  b.innerHTML = corps(m, k);
  brancherPouls(b, pouls);
  b.addEventListener('click', function () { basculer(m); });

  m._noeud = b;
  plan.appendChild(b);
});

/* --- ouvrir / fermer une mère ---------------------------------------- */

var ouverte = null;
var enVol = false;

/* ⚠️ Le portrait voyage par `left`/`top` en POURCENTAGE, pas par `transform`.
   `transform: translate(%)` résout ses pourcentages sur la boîte de l'élément
   (108 px), pas sur le plan : il n'irait nulle part. Et une valeur en pixels
   serait fausse dès le premier redimensionnement, le plan étant fluide.
   Un seul élément absolu animé, le surcoût de mise en page est négligeable. */
function viser(n) {
  moi.style.left = ((n ? n.x : CENTRE.x) / VUE.w * 100) + '%';
  moi.style.top  = ((n ? n.y : CENTRE.y) / VUE.h * 100) + '%';
}

/* Un nœud qui a des enfants est une ÉTAPE (bouton) ; sinon c'est une
   destination (lien). Une seule règle, valable à toutes les profondeurs. */
function fratrie(m, montrer) {
  m.enfants.forEach(function (e, j) {
    if (!montrer) {
      if (e.enfants) fratrie(e, false);   /* on replie aussi ses descendants */
      if (e._noeud) { e._noeud.remove(); e._noeud = null; }
      if (e._base) { e._base.remove(); e._base = null; }
      if (e._pouls) { e._pouls.remove(); e._pouls = null; }
      return;
    }
    if (e._noeud) return;                 /* déjà posée (vue éclatée) */

    var base = trait(m, e, 'base');
    base.style.animationDelay = (j * 80) + 'ms';
    svg.appendChild(base);
    e._base = base;

    var pouls = trait(m, e, 'pouls');
    svg.appendChild(pouls);
    e._pouls = pouls;

    /* ⚠️ C'est l'`url` qui tranche, pas les `enfants` : GitHub a les deux et
       doit rester un LIEN (ses dépôts sont déjà dépliés, il n'y a rien à
       ouvrir). Sans `url`, le nœud est une étape et le portrait s'y rend. */
    var el;
    if (e.url) {
      el = document.createElement('a');
      el.href = e.url;
    } else {
      el = document.createElement('button');
      el.type = 'button';
      el.setAttribute('aria-expanded', 'false');
      el.addEventListener('click', function () { basculer(e); });
    }
    el.className = 'noeud noeud--enfant' + (e.url ? '' : ' noeud--etape');
    poser(el, e);
    el.style.animationDelay = (200 + j * 80) + 'ms';
    el.innerHTML = corps(e, j);
    brancherPouls(el, pouls);
    e._noeud = el;
    plan.appendChild(el);
  });

  /* ⚠️ Une étape parmi les enfants est dépliée DANS LA FOULÉE : arriver sur
     Projets pour n'y trouver que GitHub, seul, ne montrerait rien. On voit
     donc GitHub ET ses dépôts d'un coup ; y aller ensuite ne fait que
     rapprocher le portrait. */
  if (montrer) {
    m.enfants.forEach(function (e) { if (e.enfants) fratrie(e, true); });
    ecrire(racine.getAttribute('data-lang'));
  }
}

/* du centre jusqu'au nœud, en passant par ses ascendants */
function chemin(n) {
  var c = [];
  while (n) { c.unshift(n); n = n.de; }
  return c;
}

function basculer(n) {
  if (enVol) return;
  if (eclate) eclater(false);
  var cible = (ouverte === n) ? (n.de || null) : n;   /* recliquer = remonter */
  var precedente = ouverte;

  var ancien = precedente ? chemin(precedente) : [];
  var nouveau = cible ? chemin(cible) : [];
  var commun = 0;
  while (commun < ancien.length && commun < nouveau.length && ancien[commun] === nouveau[commun]) commun++;

  /* ⚠️ On REMONTE puis on REDESCEND, on ne coupe jamais à travers la carte :
     le portrait suit les traits, c'est tout le sens du geste. D'une mère à
     l'autre ça fait deux étapes par le centre ; d'un petit-enfant à une autre
     branche, trois. */
  var etapes = [];
  for (var i = ancien.length - 2; i >= commun - 1; i--) etapes.push(i >= 0 ? ancien[i] : null);
  for (var k = commun; k < nouveau.length; k++) etapes.push(nouveau[k]);
  if (!etapes.length) return;

  /* on replie ce qui quitte le chemin, tout de suite : ces nœuds ne doivent
     pas rester posés pendant le trajet */
  ancien.slice(commun).forEach(function (a) { fratrie(a, false); });
  ancien.forEach(function (a) {
    if (nouveau.indexOf(a) < 0) {
      a._noeud.setAttribute('aria-expanded', 'false');
      a._noeud.classList.remove('actif');
    }
    if (a._base) a._base.classList.remove('suivi');
  });

  ouverte = cible;
  plan.classList.toggle('ouvert', !!cible);
  /* ⚠️ Au 3ᵉ niveau les mères s'effacent : la fratrie profonde vise l'intérieur
     de la carte et leur passerait dessus. */
  plan.classList.toggle('profond', nouveau.length >= 2);

  nouveau.forEach(function (a) { if (a._base) a._base.classList.add('suivi'); });
  if (cible) {
    cible._noeud.setAttribute('aria-expanded', 'true');
    cible._noeud.classList.add('actif');
  }

  retour.disabled = !cible;
  ou.hidden = !cible;

  /* seul le départ depuis le repos est ralenti : en transit on repasse par le
     centre sans s'y arrêter */
  var lentDepart = !precedente && etapes.length === 1;

  enVol = true;
  var pas = 0;
  (function voler() {
    var etape = etapes[pas++];
    var duree = (lentDepart ? VOYAGE_DEPART : VOYAGE);
    var fil = etape || ancien[commun - 1] || precedente;
    if (fil && fil._pouls) fil._pouls.classList.add('actif');
    moi.style.transitionDuration = duree + 'ms';
    moi.style.setProperty('--vol', duree + 'ms');
    viser(etape);

    /* le portrait rétrécit en chemin et reprend sa taille à l'arrivée : il file
       sur le trait au lieu de glisser. On retire puis repose la classe (avec un
       reflow forcé) sinon la seconde étape ne rejouerait pas l'animation. */
    if (!LENT.matches) {
      moi.classList.remove('moi--vol');
      void moi.offsetWidth;
      moi.classList.add('moi--vol');
    }

    setTimeout(function () {
      if (fil && fil._pouls) fil._pouls.classList.remove('actif');
      if (pas < etapes.length) return voler();

      enVol = false;
      moi.classList.remove('moi--vol');
      if (ouverte !== cible) return;        /* un autre clic a pris la main */
      /* ⚠️ La fratrie n'apparaît qu'À L'ARRIVÉE. La faire entrer tout de suite
         tuerait la lecture : on ne verrait plus le voyage, seulement un
         changement d'écran. C'est tout le geste demandé. */
      if (cible) fratrie(cible, true);
      ecrire(racine.getAttribute('data-lang'));
    }, LENT.matches ? 0 : duree);
  })();

  ecrire(racine.getAttribute('data-lang'));
  placerOu();
}

/* ⚠️ Le nom de l'étape se pose du côté du CENTRE, jamais sous le portrait :
   l'éventail sort vers l'extérieur, et une étiquette fixe en dessous percutait
   les enfants dès que la fratrie descendait (Gaming × Steam, Boutique ×
   Boilerplates, mesurés).
   ⚠️ La distance est CALCULÉE sur la boîte réelle de l'étiquette, pas fixée :
   à distance constante, une direction presque horizontale (l'ellipse en produit)
   ramenait le coin de l'étiquette sur le portrait. Et il faut la mesurer APRÈS
   `ecrire`, sinon on mesure le texte précédent. */
function placerOu() {
  if (!ouverte) return;
  var vers = Math.atan2(ouverte.y - CENTRE.y, ouverte.x - CENTRE.x);
  var ux = -Math.cos(vers), uy = -Math.sin(vers);
  /* ⚠️ Le demi-portrait est LU, pas écrit en dur : il est dimensionné en `cqw`
     et rétrécit avec le plan sur les écrans courts. Une constante figée
     éloignerait l'étiquette bien trop sur petite carte. */
  var demi = retour.offsetWidth / 2 + 8;
  var lx = ou.offsetWidth / 2 + demi;
  var ly = ou.offsetHeight / 2 + demi;
  var k = 1 / Math.max(Math.abs(ux) / lx, Math.abs(uy) / ly);
  ou.style.setProperty('--ox', (ux * k) + 'px');
  ou.style.setProperty('--oy', (uy * k) + 'px');
}

/* remonter d'un cran : le portrait est le bouton retour */
retour.addEventListener('click', function () { if (ouverte) basculer(ouverte); });
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (eclate) eclater(false);
  else if (ouverte) basculer(ouverte);
});

/* --- la vue éclatée --------------------------------------------------- */

/* Tout le plan déplié d'un coup. ⚠️ Les étiquettes rapetissent (`.eclate` en
   CSS) : à taille normale, 22 nœuds sur la même carte se percutent. */
var eclate = false;
var bouton = document.getElementById('eclat');

function deplier(n) {
  fratrie(n, true);
  n.enfants.forEach(function (e) { if (e.enfants) deplier(e); });
}

function eclater(on) {
  if (on === eclate) return;
  eclate = on;
  bouton.setAttribute('aria-pressed', on ? 'true' : 'false');
  plan.classList.toggle('eclate', on);

  if (on) {
    if (ouverte) {                       /* on rentre au centre avant d'ouvrir */
      chemin(ouverte).forEach(function (a) {
        a._noeud.setAttribute('aria-expanded', 'false');
        a._noeud.classList.remove('actif');
        if (a._base) a._base.classList.remove('suivi');
      });
      ouverte = null;
    }
    plan.classList.remove('ouvert', 'profond');
    retour.disabled = true;
    ou.hidden = true;
    viser(null);
    MERES.forEach(deplier);
  } else {
    MERES.forEach(function (m) { fratrie(m, false); });
  }
  ecrire(racine.getAttribute('data-lang'));
}

bouton.addEventListener('click', function () { eclater(!eclate); });

/* --- le repli, même source -------------------------------------------
   ⚠️ Sous 880 px il n'y a rien à ouvrir : tout est déjà déplié. Les étapes
   (mères, et GitHub) ne sont donc que des intertitres, jamais des liens. */
function replier(n, niveau) {
  n.enfants.forEach(function (e) {
    /* une étape sans destination n'est qu'un intertitre */
    if (!e.url) {
      var t = document.createElement('p');
      t.className = 'liste__mere' + (niveau ? ' liste__mere--sous' : '');
      e._liste = t;
      liste.appendChild(t);
      replier(e, niveau + 1);
      return;
    }
    var a = document.createElement('a');
    a.className = 'liste__lien' + (niveau > 1 ? ' liste__lien--enfant' : '');
    a.href = e.url;
    a.innerHTML = '<svg aria-hidden="true"><use href="#' + e.i + '"/></svg><b></b><span></span>';
    e._liste = a;
    liste.appendChild(a);
    /* GitHub est un lien ET un parent : ses dépôts se rangent sous lui */
    if (e.enfants) replier(e, niveau + 1);
  });
}
replier({ enfants: MERES }, 0);

/* --- langue ---------------------------------------------------------- */
function ecrire(lang) {
  NOEUDS.forEach(function (n) {
    var t = n[lang];
    if (n._noeud) {
      n._noeud.querySelector('.n').textContent = t[0];
      n._noeud.querySelector('.f').textContent = t[1];
      n._noeud.setAttribute('aria-label', t[0] + ', ' + t[1]);
    }
    if (n._liste) {
      /* ⚠️ Sur `url`, pas sur `enfants` : GitHub a des enfants mais reste un
         lien, avec son icône et sa note — pas un intertitre. */
      if (!n.url) { n._liste.textContent = t[0]; }
      else {
        n._liste.querySelector('b').textContent = t[0];
        n._liste.querySelector('span').textContent = t[1];
      }
    }
  });

  var mots = lang === 'fr'
    ? { retour: 'revenir', centre: 'revenir au centre', eclat: 'Vue éclatée', replier: 'Replier' }
    : { retour: 'back',    centre: 'back to centre',    eclat: 'Exploded view', replier: 'Collapse' };

  /* le retour remonte d'un CRAN, pas jusqu'au centre : depuis GitHub il ramène
     à Projets, et le libellé doit le dire */
  var parent = ouverte && ouverte.de;
  retour.setAttribute('aria-label',
    !ouverte ? 'Maxime Lacoste' : (parent ? mots.retour + ' : ' + parent[lang][0] : mots.centre));
  if (ouverte) {
    ou.querySelector('b').textContent = ouverte[lang][0];
    ou.querySelector('span').textContent = parent ? parent[lang][0] : mots.centre;
  }
  bouton.querySelector('.eclat__mot').textContent = eclate ? mots.replier : mots.eclat;
}

function appliquer(lang) {
  racine.setAttribute('data-lang', lang);
  racine.setAttribute('lang', lang);
  document.querySelectorAll('[data-set-lang]').forEach(function (b) {
    var on = b.getAttribute('data-set-lang') === lang;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.disabled = on;
  });
  ecrire(lang);
  try { localStorage.setItem('maxyull-lang', lang); } catch (e) {}
}

/* ?lang=fr / ?lang=en force la langue — lien partageable, capture déterministe */
var choix = new URLSearchParams(location.search).get('lang');
if (choix !== 'fr' && choix !== 'en') {
  try { choix = localStorage.getItem('maxyull-lang'); } catch (e) {}
}
if (choix !== 'fr' && choix !== 'en') {
  choix = (navigator.language || 'fr').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
}
appliquer(choix);

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-set-lang]');
  if (b) appliquer(b.getAttribute('data-set-lang'));
});

/* on lance l'entrée après le premier rendu, sinon la première image saute */
requestAnimationFrame(function () { plan.classList.add('dessine'); });

/* ⚠️ `fini` décroche l'animation d'entrée des mères. Sans ça leur `forwards`
   garde la main sur `opacity` et le fondu des mères non ouvertes ne se produit
   jamais. Le délai couvre la dernière : 240 + 4×90 + 420 (pose) + 420 (durée).
   Deux pièges déjà rencontrés : ce doit rester un TIMER et pas un
   `animationend` (en mouvement réduit l'animation n'existe pas, l'événement ne
   viendrait jamais), et il doit vivre HORS du `requestAnimationFrame` ci-dessus
   — imbriqué dedans, il ne se posait pas du tout dans certains rendus. */
setTimeout(function () { plan.classList.add('fini'); }, LENT.matches ? 0 : 1500);
</script>

</body>
</html>
